<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanzas Duo SuperApp</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <!-- Chart.js para Gráficos Animados -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- Fondo animado con gradientes de cristal -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <header class="top-bar glass">
    <div class="logo-area">
      <div class="pulse-indicator"></div>
      <h1>Finanzas Duo <span>Pro</span></h1>
    </div>
    <div class="rate-badge glass" id="rate-badge">
      <span>🇻🇪 BCV:</span> <strong id="bcv-rate">Cargando...</strong>
    </div>
  </header>

  <main class="content">
    <!-- Balance Principal con animación Glassmorphism -->
    <section class="card balance-card glass">
      <h2>Balance Total (USD)</h2>
      <div class="total-amount" id="total-balance">$0.00</div>
      <div class="total-ves" id="total-balance-ves">≈ 0.00 Bs.</div>
      
      <div class="balance-details">
        <div class="income-box">
          <span class="icon">▲</span>
          <div>
            <p>Ingresos</p>

            <strong id="total-income">$0.00</strong>
          </div>
        </div>
        <div class="expense-box">
          <span class="icon">▼</span>
          <div>
            <p>Gastos</p>
            <strong id="total-expense">$0.00</strong>
          </div>
        </div>
      </div>
    </section>

    <!-- Vincular Pareja en Tiempo Real -->
    <section class="card pair-section glass">
      <div class="section-title">
        <h3>⚡ Modo Pareja en Vivo</h3>
        <span class="badge-live">Realtime</span>
      </div>
      <div class="pair-controls">
        <div class="code-box glass">
          <span>Tu Código:</span>
          <strong id="my-pair-code">---</strong>
        </div>
        <div class="input-group">
          <input type="text" id="partner-code-input" placeholder="Código de pareja">
          <button id="btn-link-partner" class="btn-glow">Vincular</button>
        </div>
      </div>
    </section>

    <!-- Gráficos Animados -->
    <section class="card chart-section glass">
      <h3>📊 Distribución de Gastos</h3>
      <div class="chart-container">
        <canvas id="expensesChart"></canvas>
      </div>
    </section>

    <!-- Historial de Movimientos -->
    <section class="card movements-section glass">
      <h3>📜 Historial Reciente</h3>
      <ul id="movements-list" class="movements-list">
        <!-- Se genera en vivo con animaciones -->
      </ul>
    </section>
  </main>

  <!-- Botón Flotante Animado -->
  <button class="fab btn-glow" id="btn-open-modal">+</button>

  <!-- Modal Nuevo Movimiento -->
  <div class="modal" id="modal-movement">
    <div class="modal-content glass">
      <div class="modal-header">
        <h3>Registrar Movimiento</h3>
        <button id="btn-close-modal" class="btn-close">&times;</button>
      </div>
      <form id="form-movement">
        <div class="type-selector glass">
          <button type="button" class="btn-type active" data-type="expense">Gasto</button>
          <button type="button" class="btn-type" data-type="income">Ingreso</button>
        </div>

        <div class="currency-toggle glass">
          <label>Moneda del registro:</label>
          <div class="toggle-options">
            <button type="button" class="btn-curr active" data-curr="VES">🇻🇪 Bolívares (Bs)</button>
            <button type="button" class="btn-curr" data-curr="USD">💵 Dólares ($)</button>
          </div>
        </div>
        
        <div class="input-container">
          <input type="number" step="0.01" id="amount" placeholder="Monto" required>
          <div class="converted-preview" id="converted-preview">≈ $0.00 USD</div>
        </div>

        <input type="text" id="concept" placeholder="Concepto (ej: Automercado, Barbería)" required>
        
        <select id="category">
          <option value="Comida">🛒 Comida / Mercado</option>
          <option value="Servicios">💡 Servicios / Facturas</option>
          <option value="Transporte">🚌 Transporte / Gasolina</option>
          <option value="Ocio">🎉 Ocio / Salidas</option>
          <option value="Salud">💊 Salud / Medicina</option>
          <option value="Otros">📦 Otros</option>
        </select>

        <label for="receipt-image" class="file-label glass">
          📸 Adjuntar Comprobante / Foto
        </label>
        <input type="file" id="receipt-image" accept="image/*">

        <button type="submit" class="btn-primary btn-glow">Guardar Movimiento</button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
